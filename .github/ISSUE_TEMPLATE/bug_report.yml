name: Bug report
description: Report a reproducible software defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project. Do not include credentials, private HPC details, unpublished data, or user databases.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
      placeholder: |
        1. Start the application with ...
        2. Create a disposable project ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Node.js 22.x, browser version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Redact usernames, paths, tokens, hosts, job IDs, and unpublished scientific data.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private paths, HPC details, databases, and unpublished research data.
          required: true
        - label: This is not a privately reportable security vulnerability.
          required: true
